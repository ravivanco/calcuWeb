<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DECOKASA · Sistema visual</title><link rel="stylesheet" href="/src/index.css"><style>main{max-width:900px;margin:40px auto;padding:20px}.preview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}.preview-color{height:64px;border-radius:8px;border:1px solid #ddd}.preview-item small{display:block;color:var(--muted);margin-top:8px}section{margin:24px 0}h1{margin-bottom:24px}h2{margin-bottom:16px}.demo-controls{display:flex;gap:12px;flex-wrap:wrap}.demo-controls label{width:160px}#feedback{min-height:32px;margin-top:12px}</style></head><body><main><h1>DECOKASA · Sistema visual</h1><section class="workspace-section"><h2>Color</h2><div class="preview-grid" id="colors"></div></section><section class="workspace-section"><h2>Controles y estados</h2><div class="demo-controls"><button class="button-primary" id="confirm">Añadir al presupuesto</button><button class="button-secondary">Imprimir o guardar PDF</button><button class="button-secondary" disabled>Deshabilitado</button></div><p id="feedback" role="status"></p><div class="demo-controls"><label>Precio · USD<input inputmode="decimal" placeholder="Por cotizar"></label><label>Dato inválido<input value="0" aria-invalid="true" aria-describedby="error"><small id="error" class="field-error">Ingresa una medida mayor a cero.</small></label></div></section><section class="workspace-section"><h2>Materiales · imágenes ilustrativas</h2><div class="family-grid" id="materials"></div></section><a class="button-secondary" href="/">Abrir calculadora</a></main><script>const colors={Fondo:'--canvas',Superficie:'--surface',Texto:'--ink',Secundario:'--muted',Marca:'--brand',Seleccionado:'--selected',Pendiente:'--pending-surface',Error:'--error'};for(const [name,token] of Object.entries(colors)){const element=document.createElement('div');element.className='preview-item';element.innerHTML=`<div class="preview-color" style="background:var(${token})"></div><small>${name} · ${token}</small>`;document.querySelector('#colors').append(element)}for(const family of ['pvc','wpc','wpet','adhesivas','geometricos','piedras','pisos','exteriores','cielos']){const button=document.createElement('button');button.className='family-button';button.setAttribute('aria-pressed','false');button.innerHTML=`<span class="material-thumbnail family-${family}" aria-hidden="true"></span><span>${family}</span>`;button.onclick=()=>{document.querySelectorAll('.family-button').forEach(b=>{b.classList.remove('selected');b.setAttribute('aria-pressed','false')});button.classList.add('selected');button.setAttribute('aria-pressed','true')};document.querySelector('#materials').append(button)}document.querySelector('#confirm').onclick=()=>{document.querySelector('#feedback').textContent='Añadido al presupuesto.'};</script></body></html>
